{% extends "base.html" %}

{% block content %}
<main class="min-h-screen bg-gray-50 py-16 px-6">
    
    <h1 class="text-center text-5xl font-bold text-gray-800 tracking-tight mb-16">
        Cadastre Sua Roupa
    </h1>

    <aside class="max-w-3xl mx-auto bg-white p-16 rounded-2xl shadow-xl border border-gray-100">
        <form method="POST" class="space-y-10">
            {% csrf_token %}

            <div>
                <label class="block text-xl font-medium text-gray-600 mb-3">Tipo de Roupa</label>
                <input type="text" name="nome" placeholder="Ex: Camiseta" class="w-full border-2 border-gray-200 p-4 rounded-lg focus:border-blue-300 focus:ring-blue-100">
            </div>

            <div class="grid grid-cols-2 gap-10">
                <div>
                    <label class="block text-xl font-medium text-gray-600 mb-3">Quantidade</label>
                    <input type="number" name="quantidade" min="1" value="1" placeholder="1" class="w-full border-2 border-gray-200 p-4 rounded-lg">
                </div>
                <div>
                    <label class="block text-xl font-medium text-gray-600 mb-3">Tamanho</label>
                    <select name="tamanho" class="w-full border-2 border-gray-200 p-4 rounded-lg bg-white appearance-none">
                        <option value="">Selecione</option>
                        <option>P</option>
                        <option>M</option>
                        <option>G</option>
                        <option>GG</option>
                        <option>Único</option>
                        <option>Infantil</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xl font-medium text-gray-600 mb-3">Categoria</label>
                <select name="categoria" class="w-full border-2 border-gray-200 p-4 rounded-lg">
                    <option value="">Selecione</option>
                    <option>Masculino</option>
                    <option>Feminino</option>
                    <option>Infantil</option>
                    <option>Unissex</option>
                    <option>Inverno</option>
                    <option>Verão</option>
                </select>
            </div>

            <div>
                <label class="block text-xl font-medium text-gray-600 mb-3">Estado</label>
                <select name="estado" class="w-full border-2 border-gray-200 p-4 rounded-lg">
                    <option value="">Selecione</option>
                    <option>Novo</option>
                    <option>Semi-novo</option>
                    <option>Usado (bom estado)</option>
                    <option>Usado (necessita reparo)</option>
                </select>
            </div>

            <div>
                <label class="block text-xl font-medium text-gray-600 mb-3">Localização (CEP)</label>
                <input type="text" name="localizacao" placeholder="00000-000" class="w-full border-2 border-gray-200 p-4 rounded-lg">
            </div>

            <div>
                <label class="block text-xl font-medium text-gray-600 mb-3">Disponibilidade</label>
                <select name="disponibilidade" class="w-full border-2 border-gray-200 p-4 rounded-lg">
                    <option value="">Selecione</option>
                    <option>Disponível para retirada</option>
                    <option>Disponível para entrega</option>
                    <option>Ambos (retirada ou entrega)</option>
                    <option>A combinar</option>
                </select>
            </div>

            <div>
                <label class="block text-xl font-medium text-gray-600 mb-3">Anexe uma imagem</label>
                <input type="file" class="w-full text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <div class="pt-8 flex justify-center">
                <button type="submit" class="bg-[#FFB366] text-white px-16 py-4 rounded-lg font-bold text-2xl shadow-sm hover:brightness-95 transition">
                    Publicar Doação
                </button>
            </div>

            <div class="text-center mt-4">
                <a href="{% url 'selecao_tipo_doacao' %}" class="text-gray-400 hover:underline">
                    ← Voltar para seleção
                </a>
            </div>

        </form>
    </aside>

</main>
{% endblock %}
