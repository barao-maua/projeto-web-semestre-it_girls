{% extends "base.html" %}

{% block content %}
<main class="min-h-screen bg-gray-50 py-16 px-6">
    
    <h1 class="text-center text-5xl font-bold text-gray-800 tracking-tight mb-16">
        Cadastre Sua Roupa
    </h1>

    <aside class="max-w-3xl mx-auto bg-white p-16 rounded-2xl shadow-xl border border-gray-100">
        
        <form class="space-y-10">
            <div>
                <label class="block text-xl font-medium text-gray-600 mb-3">Tipo de Roupa</label>
                <input type="text" placeholder="Ex: Camiseta" class="w-full border-2 border-gray-200 p-4 rounded-lg focus:border-blue-300 focus:ring-blue-100">
            </div>

            <div class="grid grid-cols-2 gap-10">
                <div>
                    <label class="block text-xl font-medium text-gray-600 mb-3">Quantidade</label>
                    <input type="number" placeholder="1" class="w-full border-2 border-gray-200 p-4 rounded-lg">
                </div>
                <div>
                    <label class="block text-xl font-medium text-gray-600 mb-3">Tamanho</label>
                    <select class="w-full border-2 border-gray-200 p-4 rounded-lg bg-white appearance-none">
                        <option>P</option>
                        <option>M</option>
                        <option>G</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xl font-medium text-gray-600 mb-3">Categoria</label>
                <select class="w-full border-2 border-gray-200 p-4 rounded-lg"><option>V</option></select>
            </div>
            <div>
                <label class="block text-xl font-medium text-gray-600 mb-3">Estado</label>
                <select class="w-full border-2 border-gray-200 p-4 rounded-lg"><option>V</option></select>
            </div>
            <div>
                <label class="block text-xl font-medium text-gray-600 mb-3">Localização (CEP)</label>
                <input type="text" placeholder="00000-000" class="w-full border-2 border-gray-200 p-4 rounded-lg">
            </div>
            <div>
                <label class="block text-xl font-medium text-gray-600 mb-3">Disponibilidade</label>
                <select class="w-full border-2 border-gray-200 p-4 rounded-lg"><option>V</option></select>
            </div>

            <div>
                <label class="block text-xl font-medium text-gray-600 mb-3">Anexe uma imagem</label>
                <input type="file" class="w-full text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <div class="pt-8 flex justify-center">
                <button type="submit" class="bg-[#FFB366] text-gray-800 px-16 py-4 rounded-lg font-bold text-2xl shadow-sm hover:brightness-95 transition">
                    Publicar Doação
                </button>
            </div>

        </form>
    </aside>

</main>
{% endblock %}
