{% extends "base.html" %}

{% block content %}
<main class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white p-10 rounded-2xl shadow-xl border border-gray-100">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-gray-800">Crie sua conta</h2>
            <p class="text-gray-500 mt-2">Junte-se à comunidade Doe+ e ajude Ribeirão Preto</p>
        </div>

        <form class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                <input type="text" placeholder="Seu nome" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-[#FFB366] outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                <input type="email" placeholder="seu@email.com" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-[#FFB366] outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                <input type="password" placeholder="Mínimo 8 caracteres" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-[#FFB366] outline-none">
            </div>

            <button type="submit" class="w-full bg-[#FFB366] text-gray-800 py-3 rounded-lg font-bold text-lg hover:bg-orange-400 transition shadow-md mt-4">
                Cadastrar agora
            </button>
            
            <p class="text-center text-sm text-gray-500 mt-6">
                Já tem uma conta? 
                <a href="{% url 'login' %}" class="text-[#79B4FF] font-bold hover:underline">Fazer login</a>
            </p>
        </form>
    </div>
</main>
{% endblock %}
