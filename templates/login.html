{% extends "base.html" %}

{% block content %}
<main class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white p-10 rounded-2xl shadow-xl border border-gray-100">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-gray-800">Bem-vindo ao Doe+</h2>
            <p class="text-gray-500 mt-2">Entre para começar a transformar vidas</p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                <input type="email" name="email" placeholder="seu@email.com" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-[#79B4FF] outline-none transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                <input type="password" name="senha" placeholder="••••••••" class="w-full border-2 border-gray-200 p-3 rounded-lg focus:border-[#79B4FF] outline-none transition">
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-gray-600">
                    <input type="checkbox" name="lembrar" class="mr-2"> Lembrar de mim
                </label>
                <a href="#" class="text-[#79B4FF] font-semibold hover:underline">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="w-full bg-[#79B4FF] text-white py-3 rounded-lg font-bold text-lg hover:bg-blue-500 transition shadow-md">
                Entrar
            </button>
            
            <div class="relative flex py-3 items-center">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink mx-4 text-gray-400 text-sm">ou</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>

            <a href="{% url 'cadastro_usuario' %}" class="w-full bg-white border-2 border-[#FFB366] text-[#E67E22] py-3 rounded-lg font-bold text-lg hover:bg-orange-50 transition block text-center">
            Criar conta gratuita
            </a>
        </form>
    </div>
</main>
{% endblock %}
